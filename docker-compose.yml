services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: patient_management_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Patient Management System API
      - APP_VERSION=1.0.0
      - APP_ENV=production
      - APP_DEBUG=false
      - CORS_ORIGINS=*
    volumes:
      - ./patient.json:/app/patient.json
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
